; Example: ST7735 0.96" TFT demo, bare-metal STM32 (CMSIS, no framework)
;
; This project depends on the parent library (st7735-096tft-driver).
; Flash with an ST-Link v2:  pio run -t upload

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = cmsis

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200

; the library is one level up from examples/bare-metal
lib_deps =
    file://../..

build_flags =
    -Os
