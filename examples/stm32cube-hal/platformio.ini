; Example: ST7735 0.96" TFT demo on STM32Cube HAL (framework = stm32cube)
;
; This project depends on the parent library (st7735-096tft-driver).
; Flash with an ST-Link v2:  pio run -t upload

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200

; the library is one level up from examples/stm32cube-hal
lib_deps =
    file://../..

build_flags =
    -Os
