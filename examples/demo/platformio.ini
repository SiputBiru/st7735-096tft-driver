; Example: ST7735 0.96" TFT demo on the nologo STM32F103C8T6 board
;
; This project depends on the parent library (st7735-096tft-driver).
; Flash with an ST-Link v2:  pio run -t upload

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200

; the library is one level up from examples/demo
lib_deps =
    file://../..

build_flags =
    -Os
